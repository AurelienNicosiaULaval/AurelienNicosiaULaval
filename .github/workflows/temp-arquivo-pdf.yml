name: Récupération temporaire PDF via Arquivo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --upgrade requests pypdf
      - name: Récupérer les PDF via Arquivo
        run: |
          set +e
          python temp_download_missing_arquivo.py > run_arquivo.log 2>&1
          status=$?
          cat run_arquivo.log
          exit $status
      - name: Créer l'archive
        if: always()
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive("notes-master-math-france-arquivo","zip","notes_master_math_france_arquivo")
          PY
      - name: Publier l'archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-master-math-france-arquivo
          path: |
            notes-master-math-france-arquivo.zip
            notes_master_math_france_arquivo/manifest.csv
            notes_master_math_france_arquivo/manifest.json
            run_arquivo.log
          if-no-files-found: error
          retention-days: 3
